<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <style>
    /* Sits 4px outside the recorded area: a thin tally line plus viewfinder corners. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .line { position: fixed; inset: 2px; border: 1.5px solid rgba(255, 75, 62, 0.85); }
    .c { position: fixed; width: 22px; height: 22px; border: 0 solid #ff4b3e; }
    .tl { left: 0; top: 0; border-left-width: 4px; border-top-width: 4px; }
    .tr { right: 0; top: 0; border-right-width: 4px; border-top-width: 4px; }
    .bl { left: 0; bottom: 0; border-left-width: 4px; border-bottom-width: 4px; }
    .br { right: 0; bottom: 0; border-right-width: 4px; border-bottom-width: 4px; }
  </style>
</head>
<body><div class="line"></div><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></body>
</html>
