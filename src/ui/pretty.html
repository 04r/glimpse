<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:">
  <title>Make it pretty</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="pretty.css">
</head>
<body>
  <header class="top">
    <b class="title">Make it pretty</b>
    <div class="sizes" id="sizes"></div>
    <span class="grow"></span>
    <span class="status" id="status"></span>
    <div class="seg" id="scale" title="Export size"><button data-v="1">1×</button><button data-v="2">2×</button></div>
    <button class="btn" id="save" title="Save as PNG (Ctrl+S)"></button>
    <button class="btn" id="upload" title="Upload and copy link (Ctrl+D)"></button>
    <button class="btn primary" id="copy" title="Copy (Ctrl+C)"></button>
  </header>

  <aside class="left">
    <section>
      <h2>Frame</h2>
      <div class="frames" id="frames"></div>
      <div class="field" id="urlRow"><input type="text" id="url" spellcheck="false" placeholder="example.com"></div>
    </section>
    <section>
      <h2>Style</h2>
      <div class="ctl"><label>Corners <b id="radV"></b></label><input type="range" id="rad" min="0" max="60" step="1"></div>
      <div class="ctl"><label>Border <b id="borderV"></b></label><input type="range" id="border" min="0" max="20" step="1"></div>
      <div class="ctl"><div class="lab">Border color</div><div class="seg wide" id="borderColor"><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
    </section>
    <section>
      <h2>Shadow</h2>
      <div class="shadows" id="shadows"></div>
      <div class="ctl"><label>Strength <b id="shadowStrV"></b></label><input type="range" id="shadowStr" min="0" max="100" step="1"></div>
    </section>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <span class="dims readout" id="dims"></span>
  </main>

  <aside class="right">
    <section>
      <h2>Tilt</h2>
      <div class="tilts" id="tilts"></div>
      <div class="ctl"><label>Rotate X <b id="rxV"></b></label><input type="range" id="rx" min="-70" max="70" step="1"></div>
      <div class="ctl"><label>Rotate Y <b id="ryV"></b></label><input type="range" id="ry" min="-70" max="70" step="1"></div>
      <div class="ctl"><label>Rotate Z <b id="rzV"></b></label><input type="range" id="rz" min="-45" max="45" step="1"></div>
      <div class="ctl"><label>Depth <b id="depthV"></b></label><input type="range" id="depth" min="10" max="100" step="1"></div>
    </section>
    <section>
      <h2>Position</h2>
      <div class="ctl"><label>Size <b id="zoomV"></b></label><input type="range" id="zoom" min="40" max="100" step="1"></div>
      <div class="ctl"><label>Move up and down <b id="oyV"></b></label><input type="range" id="oy" min="-50" max="50" step="1"></div>
      <div class="ctl"><label>Move left and right <b id="oxV"></b></label><input type="range" id="ox" min="-50" max="50" step="1"></div>
    </section>
    <section>
      <h2>Background</h2>
      <div class="seg wide" id="bgKind"><button data-v="gradient">Gradient</button><button data-v="mesh">Mesh</button><button data-v="solid">Solid</button><button data-v="blur">Blur</button><button data-v="none">None</button></div>
      <div class="bgs" id="bgs"></div>
      <div class="ctl" id="customRow"><label class="custom"><input type="color" id="custom"> Custom color</label></div>
      <div class="ctl"><label class="check"><input type="checkbox" id="grain"> Grain</label></div>
    </section>
  </aside>

  <script src="icons.js"></script>
  <script src="pretty.js"></script>
</body>
</html>
