<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: var(--ui); color: var(--paper); }
    .t {
      position: absolute; inset: 6px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 12px;
      border-radius: var(--r-panel); background: rgba(28, 32, 39, 0.98); border: 1px solid var(--edge);
      box-shadow: 0 10px 26px -10px rgba(0, 0, 0, 0.7);
    }
    .t.click { cursor: pointer; }
    .t.click:hover { background: #222731; }
    .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--body-3); color: var(--fog); }
    .ic svg { width: 17px; height: 17px; }
    .success .ic { background: var(--focus); color: var(--focus-ink); }
    .error .ic { background: var(--tally); color: #fff; }
    .tx { min-width: 0; flex: 1; }
    .ti { font-size: 14.5px; font-weight: 600; line-height: 1.25; }
    .su { font-size: 12.5px; color: var(--fog); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .act { flex: none; font-size: 12.5px; font-weight: 600; color: var(--paper); padding: 5px 9px; border-radius: 7px; background: var(--body-3); }
    .spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="t" id="t"><div class="ic" id="ic"></div><div class="tx"><div class="ti" id="ti"></div><div class="su" id="su"></div></div><span class="act" id="act" hidden></span></div>
  <script>
    const api = window.glimpse;
    const t = document.getElementById('t');
    const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const icons = {
      info: svg('<path d="M12 11v5"/><path d="M12 7.5h.01"/>'),
      success: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
      error: svg('<path d="M12 6.5v7"/><path d="M12 17.5h.01"/>'),
      busy: '<div class="spin"></div>',
    };
    api.on('toast:show', ({ title, sub, kind, clickable, actionLabel }) => {
      const busy = /…$/.test(title);
      t.className = 't ' + kind + (clickable ? ' click' : '');
      document.getElementById('ic').innerHTML = busy ? icons.busy : icons[kind] || icons.info;
      document.getElementById('ti').textContent = title;
      document.getElementById('su').textContent = sub || '';
      const act = document.getElementById('act');
      act.hidden = !(clickable && actionLabel);
      act.textContent = actionLabel || '';
    });
    t.addEventListener('click', () => api.send('toast:click'));
    t.addEventListener('mouseenter', () => api.send('toast:hover', true));
    t.addEventListener('mouseleave', () => api.send('toast:hover', false));
  </script>
</body>
</html>
