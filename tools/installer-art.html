<!doctype html>
<!-- Installer artwork, rendered by tools/make-assets.js. ?part=sidebar (328x628) or ?part=header (300x114), drawn at 2x. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../src/ui/tokens.css">
<style>
  html, body { margin: 0; overflow: hidden; background: #1c2027; font-family: "Barlow", sans-serif; color: #eceef2; }
  .mark { position: absolute; }
  .mark i { position: absolute; border: 0 solid #ffd23f; }
  .mark .dot { border-radius: 50%; background: #ffd23f; border: 0; }
  #sidebar { position: relative; width: 328px; height: 628px; }
  #sidebar .mark { left: 40px; top: 64px; width: 84px; height: 84px; }
  #sidebar .mark i { width: 26px; height: 26px; }
  #sidebar .mark .a { left: 0; top: 0; border-left-width: 7px; border-top-width: 7px; }
  #sidebar .mark .b { right: 0; top: 0; border-right-width: 7px; border-top-width: 7px; }
  #sidebar .mark .c { left: 0; bottom: 0; border-left-width: 7px; border-bottom-width: 7px; }
  #sidebar .mark .d { right: 0; bottom: 0; border-right-width: 7px; border-bottom-width: 7px; }
  #sidebar .mark .dot { left: 35px; top: 35px; width: 14px; height: 14px; }
  #sidebar h1 { position: absolute; left: 38px; top: 172px; margin: 0; font-size: 62px; font-weight: 700; letter-spacing: -0.02em; }
  #sidebar p { position: absolute; left: 40px; right: 30px; top: 252px; margin: 0; font-size: 26px; line-height: 1.3; color: #8c93a1; font-weight: 500; }
  #sidebar .keys { position: absolute; left: 40px; bottom: 56px; display: flex; gap: 10px; align-items: center; color: #8c93a1; font-size: 22px; }
  .k { display: inline-grid; place-items: center; height: 44px; padding: 0 14px; border-radius: 7px; background: #2f3540; color: #eceef2;
    font: 700 22px "Barlow Readout", sans-serif; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
  #sidebar .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #ffd23f; }
  #header { position: relative; width: 300px; height: 114px; }
  #header .mark { left: 26px; top: 29px; width: 56px; height: 56px; }
  #header .mark i { width: 18px; height: 18px; }
  #header .mark .a { left: 0; top: 0; border-left-width: 5px; border-top-width: 5px; }
  #header .mark .b { right: 0; top: 0; border-right-width: 5px; border-top-width: 5px; }
  #header .mark .c { left: 0; bottom: 0; border-left-width: 5px; border-bottom-width: 5px; }
  #header .mark .d { right: 0; bottom: 0; border-right-width: 5px; border-bottom-width: 5px; }
  #header .mark .dot { left: 23px; top: 23px; width: 10px; height: 10px; }
  #header b { position: absolute; left: 102px; top: 30px; font-size: 44px; font-weight: 700; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div id="sidebar" hidden>
    <div class="mark"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="dot"></i></div>
    <h1>Glimpse</h1>
    <p>Screenshots and GIFs, one key away.</p>
    <div class="keys"><span class="k">PrtSc</span> to capture</div>
    <div class="strip"></div>
  </div>
  <div id="header" hidden>
    <div class="mark"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="dot"></i></div>
    <b>Glimpse</b>
  </div>
  <script>
    const part = new URLSearchParams(location.search).get('part') || 'sidebar';
    document.getElementById(part).hidden = false;
  </script>
</body>
</html>
